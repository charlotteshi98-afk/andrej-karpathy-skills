<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VO Script Summary Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Mono:wght@400;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <span class="vo-badge">VO</span>
      <span class="header-title">Script Summary Tool</span>
    </div>
    <div class="font-size-toggle">
      <button class="fsz-btn" data-size="11">S</button>
      <button class="fsz-btn active" data-size="13">M</button>
      <button class="fsz-btn" data-size="15">L</button>
    </div>
    <button id="toggleCollapse" class="collapse-btn">−</button>
  </div>

  <!-- API KEY BAR -->
  <div class="api-bar">
    <input type="password" id="apiKeyInput" placeholder="Anthropic API key (sk-ant-…)" autocomplete="off" />
    <button id="saveApiKey" class="btn-teal btn-sm">Save</button>
    <span id="apiKeyStatus" class="key-status"></span>
  </div>

  <!-- COLLAPSIBLE BODY -->
  <div id="mainBody">

    <!-- CN UPLOAD ZONE -->
    <div class="upload-zone" id="cnUploadZone">
      <div class="upload-inner">
        <div class="upload-icon">↑</div>
        <div class="upload-label">Drop CN master script (.xlsx) here or click to upload</div>
        <input type="file" id="cnFileInput" accept=".xlsx" style="display:none" />
      </div>
    </div>
    <div id="cnMeta" class="meta-chips" style="display:none"></div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" data-tab="general">Summary</button>
      <button class="tab" data-tab="structured">Structured</button>
      <button class="tab" data-tab="glossary">Glossary</button>
      <button class="tab" data-tab="archive">Archive</button>
    </div>

    <!-- TAB: GENERAL -->
    <div id="tab-general" class="tab-content active">
      <div class="controls-row">
        <label class="ctrl-label">Length</label>
        <select id="summaryLength" class="ctrl-select">
          <option value="100">~100 words</option>
          <option value="200" selected>~200 words</option>
          <option value="300">~300 words</option>
          <option value="500">~500 words</option>
          <option value="800">~800 words</option>
        </select>
        <label class="ctrl-label">Language</label>
        <div class="lang-toggle">
          <button class="lang-btn active" data-lang="zh">中文</button>
          <button class="lang-btn" data-lang="en">English</button>
        </div>
      </div>
      <div id="enUploadInGeneral" style="display:none">
        <div class="action-row">
          <button id="scanSheetBtn" class="btn-teal btn-sm-text" title="Read the EN VO tracker from the Google Sheet open in the current tab">Scan current Google Sheet</button>
        </div>
        <div class="upload-zone upload-zone-sm" id="enUploadZone">
          <div class="upload-inner">
            <div class="upload-icon">↑</div>
            <div class="upload-label">…or drop EN VO tracker (.xlsx) here / click to upload</div>
            <input type="file" id="enFileInput" accept=".xlsx" style="display:none" />
          </div>
        </div>
        <div id="enMeta" class="meta-chips" style="display:none"></div>
      </div>
      <div class="pill-row" id="summaryOptions">
        <button class="pill active" data-opt="characters">Characters &amp; relationships</button>
        <button class="pill active" data-opt="plot">Key plot events</button>
        <button class="pill" data-opt="themes">Themes &amp; tone</button>
        <button class="pill" data-opt="vo">VO content summary</button>
      </div>
      <div class="action-row">
        <button id="generateGeneral" class="btn-gold" title="Quick production brief at the selected length">Generate Summary</button>
        <button id="generateComprehensive" class="btn-teal" title="In-depth analysis: narrative, themes, characters, setting, style. Slower — analyzes the script in segments first.">Comprehensive Analysis</button>
      </div>
      <div id="comprehensiveProgress" class="progress-note" style="display:none"></div>
      <div id="generalError" class="error-msg" style="display:none"></div>
      <div id="generalOutput" class="output-area" style="display:none">
        <div class="output-header">
          <span class="output-label" id="generalOutputLabel">Summary</span>
          <button id="copyGeneral" class="btn-copy">Copy</button>
          <button id="saveGeneralToArchive" class="btn-copy" style="display:none">Save</button>
        </div>
        <textarea id="generalText" class="output-text" readonly></textarea>
      </div>
    </div>

    <!-- TAB: STRUCTURED -->
    <div id="tab-structured" class="tab-content">
      <div class="pill-row" id="structuredColSelector">
  <span class="ctrl-label" style="align-self:center">Cols</span>
  <button class="col-pill pill active" data-col="0">PerformID</button>
  <button class="col-pill pill active" data-col="1">类型</button>
  <button class="col-pill pill active" data-col="2">场景描述</button>
  <button class="col-pill pill active" data-col="3">台词</button>
  <button class="col-pill pill active" data-col="4">VO</button>
  <button class="col-pill pill active" data-col="5">故事总结</button>
</div>
      <div class="action-row">
        <button id="generateStructured" class="btn-gold">Generate Table</button>
      </div>
      <div id="structuredError" class="error-msg" style="display:none"></div>
      <div id="structuredOutput" class="output-area" style="display:none">
        <div class="output-header">
          <span class="output-label">Scene Breakdown</span>
          <div class="export-btns" id="structuredExportBtns" style="display:none">
            <button id="exportCsv" class="btn-copy">CSV</button>
            <button id="exportTsv" class="btn-copy">TSV</button>
          </div>
          <button id="saveStructuredToArchive" class="btn-copy" style="display:none">Save</button>
        </div>
        <div id="structuredTable" class="table-scroll"></div>
      </div>
    </div>

    <!-- TAB: GLOSSARY -->
    <div id="tab-glossary" class="tab-content">
      <div class="upload-zone upload-zone-sm" id="tbUploadZone">
        <div class="upload-inner">
          <div class="upload-icon">↑</div>
          <div class="upload-label">Drop term base (.xlsx) here or click to upload</div>
          <input type="file" id="tbFileInput" accept=".xlsx" style="display:none" />
        </div>
      </div>
      <div id="tbMeta" class="meta-chips" style="display:none"></div>
      <div class="action-row">
        <button id="generateGlossary" class="btn-gold">Extract Terms</button>
      </div>
      <div id="glossaryError" class="error-msg" style="display:none"></div>
      <div id="glossaryOutput" class="output-area" style="display:none">
        <div class="output-header">
          <span class="output-label">Glossary Preview (first 12)</span>
          <button id="saveGlossaryToArchive" class="btn-copy" style="display:none">Save</button>
        </div>
        <div id="glossaryTable" class="table-scroll"></div>
        <div id="glossarySummary" class="glossary-summary"></div>
      </div>
    </div>

    <!-- TAB: ARCHIVE -->
    <div id="tab-archive" class="tab-content">
      <div id="archiveEmpty" class="archive-empty">No saved summaries yet.</div>
      <div id="archiveList"></div>
    </div>

  </div><!-- /mainBody -->
</div><!-- /app -->

<script src="xlsx.full.min.js"></script>
<script src="popup.js"></script>
</body>
</html>
